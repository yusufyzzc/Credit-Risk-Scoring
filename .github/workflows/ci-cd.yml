name: CI/CD Pipeline

on:
  push:
    branches: [ main, master]
  pull_request:
    branches: [ main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create model file
      run: python train_model.py
    
    - name: Test Django application
      run: |
        # 1. Verify Django system checks pass
        python manage.py check
        
        # 2. Verify model loads correctly
        python -c "
        import os
        import django
        os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'credit_risk_project.settings')
        django.setup()
        
        from scoring.views import _MODEL
        assert _MODEL is not None
        print('Model loaded successfully')
        
        print('All tests passed!')
        "
